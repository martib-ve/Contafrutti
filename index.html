<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conta Frutti</title>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #dddddd;
            --btn-bg: #eeeeee;
            --btn-active: #cccccc;
            --danger: #ffcccc;
            --danger-text: #cc0000;
            --success: #ccffcc;
            --success-text: #006600;
            --cat-bg: #f5f5f5;
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --text-color: #ffffff;
            --border-color: #333333;
            --btn-bg: #1a1a1a;
            --btn-active: #333333;
            --danger: #330000;
            --danger-text: #ff6666;
            --success: #003300;
            --success-text: #66ff66;
            --cat-bg: #111111;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 16px; 
            padding-bottom: 80px;
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 8px; 
            border: 1px solid var(--border-color); 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-size: 16px;
            border-radius: 0;
            appearance: none;
        }

        button { 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            background-color: var(--btn-bg); 
            color: var(--text-color); 
            font-size: 16px; 
            cursor: pointer; 
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 0;
            margin-bottom: 8px;
            width: 100%;
        }
        
        button:active { background-color: var(--btn-active); }
        button.btn-danger { background-color: var(--danger); color: var(--danger-text); border-color: var(--danger-text); }
        button.btn-success { background-color: var(--success); color: var(--success-text); border-color: var(--success-text); }

        .flex-row { display: flex; gap: 8px; }
        .flex-row input, .flex-row select, .flex-row button { margin-bottom: 0; }
        .flex-row button { width: auto; flex-shrink: 0; padding-left: 16px; padding-right: 16px; }

        .section { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--border-color); }
        .section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; color: var(--text-color); font-weight: bold; }

        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--text-color); padding-bottom: 16px; margin-bottom: 24px; }
        h1 { font-size: 20px; text-transform: uppercase; }

        .category-row { 
            background-color: var(--cat-bg); 
            padding: 8px; 
            font-size: 12px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-top: 16px; 
            margin-bottom: 8px; 
            border: 1px solid var(--border-color);
        }

        .item-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 8px 0; 
            border-bottom: 1px solid var(--border-color); 
        }
        
        .item-name-group { display: flex; align-items: center; gap: 12px; }
        .item-name { font-size: 16px; }
        
        .counter-controls { display: flex; align-items: center; gap: 8px; }
        .btn-count { width: 44px; height: 44px; font-size: 24px; display: flex; align-items: center; justify-content: center; padding: 0; }
        .count-val { font-size: 20px; font-weight: bold; min-width: 40px; text-align: center; cursor: pointer; }

        .list-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px; border: 1px solid var(--border-color); margin-bottom: 8px; 
        }
        .list-item span { font-size: 18px; cursor: pointer; flex-grow: 1; }

        .collapsible-header { cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; padding: 12px; border: 1px solid var(--border-color); background: var(--btn-bg); }
        .collapsible-content { display: none; padding-top: 12px; }
        .collapsible-content.active { display: block; }

        /* PALLINE COLORE (24px) */
        .color-dot { width: 24px; height: 24px; border-radius: 50%; display: inline-block; vertical-align: middle; border: 1px solid var(--border-color); }
        .dot-nero { background-color: #000000; }
        .dot-blu { background-color: #0000ff; }
        .dot-marrone { background-color: #663300; }
        .dot-grigio { background-color: #808080; }
        .dot-rosso { background-color: #ff0000; }
        .dot-viola { background-color: #800080; }
        .dot-bianco { background-color: #ffffff; }
        .dot-terra { background: linear-gradient(90deg, #ffff00 50%, #00ff00 50%); }

        #output { white-space: pre-wrap; font-family: monospace; padding: 12px; font-size: 12px; border: 1px solid var(--border-color); margin-bottom: 12px; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-color); display: none; flex-direction: column; padding: 16px; z-index: 1000; overflow-y: auto; }
        .modal-title { font-size: 18px; margin-bottom: 16px; text-transform: uppercase; font-weight: bold; }
    </style>
</head>
<body data-theme="dark">

    <header>
        <h1>Conta Frutti</h1>
        <div style="display: flex; gap: 8px; width: auto;">
            <button onclick="toggleTema()" id="btn-tema" style="width: auto; margin:0; font-size:12px;">CHIARO</button>
            <button onclick="resetTotaleApplicazione()" class="btn-danger" style="width: auto; margin:0; font-size:12px;">RESET</button>
        </div>
    </header>

    <!-- CANTIERE -->
    <div class="section">
        <div class="section-title">Cantiere</div>
        <select id="cantiere-select" onchange="caricaCantiere()"></select>
        <div class="flex-row">
            <input type="text" id="nuovo-cantiere-nome" placeholder="Nuovo cantiere...">
            <button onclick="creaCantiere()" style="width: 80px;">CREA</button>
        </div>
        <button onclick="eliminaCantiereCorrente()" class="btn-danger">ELIMINA CANTIERE</button>
    </div>

    <!-- MATERIALE GENERALE -->
    <div class="section" id="sec-materiale-generale" style="display:none;">
        <div class="collapsible-header" onclick="toggleCollapsible('content-mat')">
            <span>MATERIALE GENERALE (CAVI, TUBI)</span>
            <span id="indicator-content-mat">+ ESPANDI</span>
        </div>
        <div id="content-mat" class="collapsible-content">
            <div id="lista-materiali-generali"></div>
            <button onclick="toggleCollapsible('content-mat')" style="margin-top:16px;">CHIUDI PANNELLO</button>
        </div>
    </div>

    <!-- STANZE -->
    <div class="section" id="sec-stanze" style="display:none;">
        <div class="section-title">Stanze</div>
        <div class="flex-row">
            <input type="text" id="nuova-stanza-nome" placeholder="Es. Cucina, Bagno...">
            <button onclick="creaStanza()" style="width: 80px;">CREA</button>
        </div>
        <div id="lista-stanze-salvate" style="margin-top: 16px;"></div>
    </div>

    <!-- CONTEGGIO STANZA (Aperto cliccando su una stanza) -->
    <div class="section" id="sec-conteggio" style="display:none; border: 2px solid var(--text-color); padding: 12px;">
        <div class="section-title" id="titolo-conteggio-stanza">CONTEGGIO</div>
        <div id="lista-frutti-conteggio"></div>
        <button onclick="salvaConteggioStanza()" style="margin-top:24px; border: 2px solid var(--text-color);">CHIUDI STANZA E SALVA</button>
    </div>

    <!-- CATALOGHI -->
    <div class="section">
        <div class="section-title">Modifica Cataloghi</div>
        
        <label style="font-size:12px; font-weight:bold;">NUOVO FRUTTO/COMANDO</label>
        <div class="flex-row">
            <input type="text" id="nuovo-frutto-nome" placeholder="Nome...">
            <button onclick="apriModalAggiunta('frutto')">AGGIUNGI</button>
        </div>

        <label style="font-size:12px; font-weight:bold; margin-top:12px; display:block;">NUOVO MATERIALE/CAVO</label>
        <div class="flex-row">
            <input type="text" id="nuovo-materiale-nome" placeholder="Nome...">
            <button onclick="apriModalAggiunta('materiale')">AGGIUNGI</button>
        </div>

        <label style="font-size:12px; font-weight:bold; margin-top:12px; display:block;">MODIFICA/ELIMINA ESISTENTE</label>
        <select id="select-modifica-voce"></select>
        <div class="flex-row">
            <button onclick="rinominaVoceCatalogo()">RINOMINA</button>
            <button onclick="eliminaVoceCatalogo()" class="btn-danger">ELIMINA</button>
        </div>
    </div>

    <!-- RIEPILOGO -->
    <div class="section" id="sec-riepilogo" style="display:none;">
        <div class="section-title">Riepilogo</div>
        <button onclick="generaRiepilogoTesto()">GENERA TESTO</button>
        
        <div id="output-box" style="display:none;">
            <div id="output"></div>
            <button onclick="inviaWhatsApp()">INVIA WHATSAPP</button>
        </div>
    </div>

    <!-- BACKUP -->
    <div class="section" style="border-bottom:none;">
        <div class="section-title">Backup Dati</div>
        <textarea id="backup-string-input" rows="3" placeholder="Incolla qui il codice di ripristino..."></textarea>
        <button onclick="ripristinaDaBackup()">RIPRISTINA</button>
    </div>

    <!-- MODAL CATEGORIA -->
    <div class="modal-overlay" id="modal-categoria">
        <div class="modal-title" id="modal-titolo">SELEZIONA CATEGORIA</div>
        <select id="modal-select-cat" onchange="gestisciCambioModalSelect()"></select>
        <input type="text" id="modal-nuova-cat-input" placeholder="Nome nuova categoria..." style="display:none;">
        <div style="margin-top:24px;">
            <button onclick="confermaAggiuntaElemento()">CONFERMA</button>
            <button onclick="chiudiModalAggiunta()">ANNULLA</button>
        </div>
    </div>

    <script>
        const ORDINE_CATEGORIE_FRUTTI = [
            "Supporti e Scatole", "Comandi", "Prese energia e dati", "Centralino", "Varie"
        ];
        
        const ORDINE_CATEGORIE_MATERIALE = [
            "Cordine 1.5 mm²", "Cordine 2.5 mm²", "Cordine 4 mm²", "Tubi e Corrugati", "Materiale Consumo"
        ];

        const STRUTTURA_FRUTTI_INIZIALE = [
            ["Supporti e Scatole", "Supporto / Scatola 503"],
            ["Supporti e Scatole", "Supporto / Scatola 504"],
            ["Supporti e Scatole", "Supporto / Scatola 506"],
            ["Supporti e Scatole", "Scatola esterna 503"],
            ["Supporti e Scatole", "Scatola 503/703 Cartongesso"],
            ["Supporti e Scatole", "Coperchio 503"],
            ["Comandi", "Interruttore (Int)"],
            ["Comandi", "Deviatore (Dev)"],
            ["Comandi", "Invertitore (Inv)"],
            ["Comandi", "Pulsante (Puls)"],
            ["Comandi", "Commutatore Tapparella/Tenda"],
            ["Comandi", "Interruttore Bipolare"],
            ["Prese energia e dati", "Presa 10A"],
            ["Prese energia e dati", "Presa 16A"],
            ["Prese energia e dati", "Presa Schuko (Sukko)"],
            ["Prese energia e dati", "Presa Dati (RJ45)"],
            ["Prese energia e dati", "Presa TV Passante"],
            ["Prese energia e dati", "Presa TV Terminale/Finale"],
            ["Varie", "Tappo (Copriforo)"],
            ["Varie", "Emergenza Estraibile"],
            ["Centralino", "Centralino: Sezionatore 32A"],
            ["Centralino", "Centralino: Salvavita 25A"],
            ["Centralino", "Centralino: Salvavita 10A"],
            ["Centralino", "Centralino: Magnetotermico 16A"],
            ["Centralino", "Centralino: Magnetotermico 25A"]
        ];

        const STRUTTURA_MATERIALE_INIZIALE = [
            ["Cordine 1.5 mm²", "Cordina 1.5 Nero"],
            ["Cordine 1.5 mm²", "Cordina 1.5 Blu"],
            ["Cordine 1.5 mm²", "Cordina 1.5 Marrone"],
            ["Cordine 1.5 mm²", "Cordina 1.5 Grigio"],
            ["Cordine 1.5 mm²", "Cordina 1.5 Rosso"],
            ["Cordine 1.5 mm²", "Cordina 1.5 Viola"],
            ["Cordine 1.5 mm²", "Cordina 1.5 Giallo/Verde (Terra)"],
            ["Cordine 2.5 mm²", "Cordina 2.5 Nero"],
            ["Cordine 2.5 mm²", "Cordina 2.5 Blu"],
            ["Cordine 2.5 mm²", "Cordina 2.5 Marrone"],
            ["Cordine 2.5 mm²", "Cordina 2.5 Grigio"],
            ["Cordine 2.5 mm²", "Cordina 2.5 Rosso"],
            ["Cordine 2.5 mm²", "Cordina 2.5 Viola"],
            ["Cordine 2.5 mm²", "Cordina 2.5 Giallo/Verde (Terra)"],
            ["Tubi e Corrugati", "Tubo Corrugato 16 mm"],
            ["Tubi e Corrugati", "Tubo Corrugato 20 mm"],
            ["Tubi e Corrugati", "Tubo Corrugato 25 mm"],
            ["Tubi e Corrugati", "Tubo Corrugato 32 mm"],
            ["Materiale Consumo", "Nastro Isolante"],
            ["Materiale Consumo", "Fascette Cablaggio Varie"]
        ];

        let catalogoFrutti = JSON.parse(localStorage.getItem('cf_v9_cat_f')) || STRUTTURA_FRUTTI_INIZIALE;
        let catalogoMateriali = JSON.parse(localStorage.getItem('cf_v9_cat_m')) || STRUTTURA_MATERIALE_INIZIALE;
        let db = JSON.parse(localStorage.getItem('cf_v9_db')) || {};
        
        let cantiereCorrente = "";
        let stanzaCorrente = "";
        let conteggioTemporaneo = {};
        let materialiTemporanei = {};
        let tipoAggiuntaCorrente = ""; 

        window.onload = function() {
            let temaSalvato = localStorage.getItem('cf_tema') || 'dark';
            document.body.setAttribute('data-theme', temaSalvato);
            document.getElementById('btn-tema').innerText = temaSalvato === 'dark' ? "CHIARO" : "SCURO";
            
            aggiornaSelectCantieri();
            let ultimi = Object.keys(db);
            if(ultimi.length > 0) document.getElementById('cantiere-select').value = ultimi[0];
            caricaCantiere();
            aggiornaSelectManutenzioneCatalogo();
        };

        function toggleTema() {
            let t = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', t);
            localStorage.setItem('cf_tema', t);
            document.getElementById('btn-tema').innerText = t === 'dark' ? "CHIARO" : "SCURO";
        }

        function salvaDati() {
            localStorage.setItem('cf_v9_db', JSON.stringify(db));
            localStorage.setItem('cf_v9_cat_f', JSON.stringify(catalogoFrutti));
            localStorage.setItem('cf_v9_cat_m', JSON.stringify(catalogoMateriali));
            aggiornaSelectManutenzioneCatalogo();
        }

        function autoSalvaMateriale() {
            if (!cantiereCorrente) return;
            db[cantiereCorrente]._materiale_generale = {};
            for(let m in materialiTemporanei) {
                if(materialiTemporanei[m] !== "0" && materialiTemporanei[m] !== "") db[cantiereCorrente]._materiale_generale[m] = materialiTemporanei[m];
            }
            salvaDati();
        }

        function autoSalvaStanza() {
            if (!cantiereCorrente || !stanzaCorrente) return;
            db[cantiereCorrente]._stanze[stanzaCorrente] = {};
            catalogoFrutti.forEach(f => {
                let n = f[1];
                if(conteggioTemporaneo[n] > 0) db[cantiereCorrente]._stanze[stanzaCorrente][n] = conteggioTemporaneo[n];
            });
            salvaDati();
        }

        function toggleCollapsible(id) {
            const el = document.getElementById(id);
            const ind = document.getElementById('indicator-' + id);
            if (el.classList.contains('active')) {
                el.classList.remove('active');
                if(ind) ind.innerText = "+ ESPANDI";
            } else {
                el.classList.add('active');
                if(ind) ind.innerText = "- COMPRIMI";
            }
        }

        function idSicuro(n) { return "id-" + n.toLowerCase().replace(/[^a-z0-9]/g, "-"); }

        function tagColore(n) {
            let t = n.toLowerCase();
            if (t.includes("giallo/verde") || t.includes("terra")) return '<span class="color-dot dot-terra"></span>';
            if (t.includes("nero")) return '<span class="color-dot dot-nero"></span>';
            if (t.includes("blu")) return '<span class="color-dot dot-blu"></span>';
            if (t.includes("marrone")) return '<span class="color-dot dot-marrone"></span>';
            if (t.includes("grigio")) return '<span class="color-dot dot-grigio"></span>';
            if (t.includes("rosso")) return '<span class="color-dot dot-rosso"></span>';
            if (t.includes("viola")) return '<span class="color-dot dot-viola"></span>';
            if (t.includes("bianco")) return '<span class="color-dot dot-bianco"></span>';
            return '';
        }

        function ordinaCatalogo(cat, ordine) {
            cat.sort((a, b) => {
                let iA = ordine.indexOf(a[0]); if(iA === -1) iA = 999;
                let iB = ordine.indexOf(b[0]); if(iB === -1) iB = 999;
                if(iA !== iB) return iA - iB;
                return a[1].localeCompare(b[1]);
            });
        }

        function aggiornaSelectCantieri() {
            const sel = document.getElementById('cantiere-select');
            sel.innerHTML = "";
            const cc = Object.keys(db);
            if(cc.length === 0) { sel.innerHTML = "<option value=''>NESSUN CANTIERE</option>"; return; }
            cc.forEach(c => { let o = document.createElement('option'); o.value = c; o.innerText = c; sel.appendChild(o); });
        }

        function creaCantiere() {
            const n = document.getElementById('nuovo-cantiere-nome').value.trim();
            if(!n) return;
            if(db[n]) return alert("ESISTE GIA'");
            db[n] = { "_materiale_generale": {}, "_stanze": {} };
            salvaDati(); aggiornaSelectCantieri();
            document.getElementById('cantiere-select').value = n;
            document.getElementById('nuovo-cantiere-nome').value = "";
            caricaCantiere();
        }

        function caricaCantiere() {
            cantiereCorrente = document.getElementById('cantiere-select').value;
            const mat = document.getElementById('sec-materiale-generale');
            const stz = document.getElementById('sec-stanze');
            const rpl = document.getElementById('sec-riepilogo');
            
            if(!cantiereCorrente) {
                mat.style.display = "none"; stz.style.display = "none"; rpl.style.display = "none";
                document.getElementById('sec-conteggio').style.display = "none";
                return;
            }

            mat.style.display = "block"; stz.style.display = "block"; rpl.style.display = "block";
            document.getElementById('sec-conteggio').style.display = "none";
            document.getElementById('output-box').style.display = "none";

            materialiTemporanei = {};
            catalogoMateriali.forEach(m => { materialiTemporanei[m[1]] = db[cantiereCorrente]._materiale_generale[m[1]] || "0"; });
            
            rendiMateriali(); rendiStanze();
        }

        function eliminaCantiereCorrente() {
            if(!cantiereCorrente) return;
            if(confirm("ELIMINARE CANTIERE?")) {
                delete db[cantiereCorrente]; salvaDati(); aggiornaSelectCantieri(); caricaCantiere();
            }
        }

        function rendiMateriali() {
            const cont = document.getElementById('lista-materiali-generali'); cont.innerHTML = "";
            let ultCat = "";
            catalogoMateriali.forEach(m => {
                let cat = m[0] || "VARIE"; let nom = m[1];
                if(cat !== ultCat) {
                    let d = document.createElement('div'); d.className = "category-row"; d.innerText = cat; cont.appendChild(d);
                    ultCat = cat;
                }
                let val = materialiTemporanei[nom] || "0";
                
                // PULIZIA TESTO
                let testVis = nom;
                if (cat.toLowerCase().includes("cordine") || cat.toLowerCase().includes("cavi")) {
                    testVis = nom.replace(/^(Cordina|Cordine|Cavo)\s+\d+(\.\d+)?\s*(mm²)?\s*/i, "");
                }

                let row = document.createElement('div'); row.className = "item-row";
                row.innerHTML = `
                    <div class="item-name-group">${tagColore(nom)}<span class="item-name">${testVis}</span></div>
                    <div class="counter-controls">
                        <button class="btn-count btn-danger" onclick="cambiaQtaMat('${nom}', -1)">-</button>
                        <span class="count-val" onclick="modQtaMat('${nom}')" id="mat-${idSicuro(nom)}">${val}</span>
                        <button class="btn-count" onclick="cambiaQtaMat('${nom}', 1)">+</button>
                    </div>`;
                cont.appendChild(row);
            });
        }

        function cambiaQtaMat(n, delta) {
            let v = parseInt(materialiTemporanei[n] || "0") + delta; if(v < 0) v = 0;
            materialiTemporanei[n] = v.toString();
            document.getElementById(`mat-${idSicuro(n)}`).innerText = v;
            autoSalvaMateriale();
        }

        function modQtaMat(n) {
            let r = prompt("QUANTITA':", materialiTemporanei[n] || "0");
            if(r !== null) {
                materialiTemporanei[n] = r.trim() === "" ? "0" : r.trim();
                document.getElementById(`mat-${idSicuro(n)}`).innerText = materialiTemporanei[n];
                autoSalvaMateriale();
            }
        }

        function rendiStanze() {
            const cont = document.getElementById('lista-stanze-salvate'); cont.innerHTML = "";
            const stz = Object.keys(db[cantiereCorrente]._stanze || {});
            if(stz.length === 0) { cont.innerHTML = "NESSUNA STANZA"; return; }
            stz.forEach(s => {
                let d = document.createElement('div'); d.className = "list-item";
                d.innerHTML = `<span onclick="apriStanza('${s}')">${s}</span><button onclick="eliminaStanza('${s}')" class="btn-danger" style="width:auto; margin:0; font-size:12px;">X</button>`;
                cont.appendChild(d);
            });
        }

        function creaStanza() {
            const i = document.getElementById('nuova-stanza-nome');
            const n = i.value.trim();
            if(!n || db[cantiereCorrente]._stanze[n]) return;
            db[cantiereCorrente]._stanze[n] = {};
            salvaDati(); i.value = ""; rendiStanze(); apriStanza(n);
        }

        function eliminaStanza(n) {
            if(confirm("ELIMINARE STANZA?")) {
                delete db[cantiereCorrente]._stanze[n]; salvaDati(); rendiStanze();
                if(stanzaCorrente === n) document.getElementById('sec-conteggio').style.display = "none";
            }
        }

        function apriStanza(n) {
            stanzaCorrente = n;
            document.getElementById('titolo-conteggio-stanza').innerText = "STANZA: " + n;
            document.getElementById('sec-conteggio').style.display = "block";
            conteggioTemporaneo = {};
            catalogoFrutti.forEach(f => { conteggioTemporaneo[f[1]] = db[cantiereCorrente]._stanze[n][f[1]] || 0; });
            rendiFrutti();
            document.getElementById('sec-conteggio').scrollIntoView();
        }

        function rendiFrutti() {
            const cont = document.getElementById('lista-frutti-conteggio'); cont.innerHTML = "";
            let ultCat = "";
            catalogoFrutti.forEach(f => {
                if(f[0] !== ultCat) {
                    let d = document.createElement('div'); d.className = "category-row"; d.innerText = f[0]; cont.appendChild(d);
                    ultCat = f[0];
                }
                let q = conteggioTemporaneo[f[1]] || 0;
                let row = document.createElement('div'); row.className = "item-row";
                row.innerHTML = `
                    <div class="item-name">${f[1]}</div>
                    <div class="counter-controls">
                        <button class="btn-count btn-danger" onclick="cambiaQtaFru('${f[1]}', -1)">-</button>
                        <span class="count-val" id="val-${idSicuro(f[1])}">${q}</span>
                        <button class="btn-count" onclick="cambiaQtaFru('${f[1]}', 1)">+</button>
                    </div>`;
                cont.appendChild(row);
            });
        }

        function cambiaQtaFru(n, delta) {
            let v = (conteggioTemporaneo[n] || 0) + delta; if(v < 0) v = 0;
            conteggioTemporaneo[n] = v;
            document.getElementById(`val-${idSicuro(n)}`).innerText = v;
            autoSalvaStanza();
        }

        function salvaConteggioStanza() {
            document.getElementById('sec-conteggio').style.display = "none";
            document.getElementById('sec-stanze').scrollIntoView();
        }

        function apriModalAggiunta(tipo) {
            tipoAggiuntaCorrente = tipo;
            let inp = document.getElementById(tipo === 'frutto' ? 'nuovo-frutto-nome' : 'nuovo-materiale-nome');
            let n = inp.value.trim();
            if (!n) return;
            document.getElementById('modal-titolo').innerText = "CATEGORIA PER: " + n;
            
            let sel = document.getElementById('modal-select-cat'); sel.innerHTML = "";
            let catEsistenti = [];
            let src = tipo === 'frutto' ? catalogoFrutti : catalogoMateriali;
            src.forEach(i => { if(!catEsistenti.includes(i[0])) catEsistenti.push(i[0]); });
            catEsistenti.forEach(c => { let o = document.createElement('option'); o.value = c; o.innerText = c; sel.appendChild(o); });
            
            let oN = document.createElement('option'); oN.value = "NEW"; oN.innerText = "+ NUOVA CATEGORIA"; sel.appendChild(oN);
            
            document.getElementById('modal-nuova-cat-input').style.display = "none";
            document.getElementById('modal-nuova-cat-input').value = "";
            document.getElementById('modal-categoria').style.display = "flex";
        }

        function gestisciCambioModalSelect() {
            document.getElementById('modal-nuova-cat-input').style.display = document.getElementById('modal-select-cat').value === "NEW" ? "block" : "none";
        }

        function chiudiModalAggiunta() { document.getElementById('modal-categoria').style.display = "none"; }

        function confermaAggiuntaElemento() {
            let sel = document.getElementById('modal-select-cat').value;
            let cat = sel === "NEW" ? document.getElementById('modal-nuova-cat-input').value.trim() : sel;
            if (!cat) return;

            if (tipoAggiuntaCorrente === 'frutto') {
                let n = document.getElementById('nuovo-frutto-nome').value.trim();
                catalogoFrutti.push([cat, n]); ordinaCatalogo(catalogoFrutti, ORDINE_CATEGORIE_FRUTTI);
                document.getElementById('nuovo-frutto-nome').value = "";
                if(stanzaCorrente) rendiFrutti();
            } else {
                let n = document.getElementById('nuovo-materiale-nome').value.trim();
                catalogoMateriali.push([cat, n]); ordinaCatalogo(catalogoMateriali, ORDINE_CATEGORIE_MATERIALE);
                document.getElementById('nuovo-materiale-nome').value = "";
                if(cantiereCorrente) rendiMateriali();
            }
            salvaDati(); chiudiModalAggiunta();
        }

        function aggiornaSelectManutenzioneCatalogo() {
            let sel = document.getElementById('select-modifica-voce'); sel.innerHTML = "";
            let g1 = document.createElement('optgroup'); g1.label = "FRUTTI";
            catalogoFrutti.forEach(f => { let o = document.createElement('option'); o.value = "f|" + f[1]; o.innerText = f[1]; g1.appendChild(o); });
            sel.appendChild(g1);
            let g2 = document.createElement('optgroup'); g2.label = "MATERIALI";
            catalogoMateriali.forEach(m => { let o = document.createElement('option'); o.value = "m|" + m[1]; o.innerText = m[1]; g2.appendChild(o); });
            sel.appendChild(g2);
        }

        function rinominaVoceCatalogo() {
            let val = document.getElementById('select-modifica-voce').value; if(!val) return;
            let p = val.split("|"); let tipo = p[0]; let vec = p[1];
            let nuo = prompt("NUOVO NOME:", vec);
            if (!nuo || nuo.trim() === vec) return; nuo = nuo.trim();

            if (tipo === 'f') {
                catalogoFrutti.forEach(f => { if(f[1] === vec) f[1] = nuo; });
                ordinaCatalogo(catalogoFrutti, ORDINE_CATEGORIE_FRUTTI);
                for(let c in db) { for(let s in db[c]._stanze) { if(db[c]._stanze[s][vec] !== undefined) { db[c]._stanze[s][nuo] = db[c]._stanze[s][vec]; delete db[c]._stanze[s][vec]; } } }
                if(stanzaCorrente) rendiFrutti();
            } else {
                catalogoMateriali.forEach(m => { if(m[1] === vec) m[1] = nuo; });
                ordinaCatalogo(catalogoMateriali, ORDINE_CATEGORIE_MATERIALE);
                for(let c in db) { if(db[c]._materiale_generale && db[c]._materiale_generale[vec] !== undefined) { db[c]._materiale_generale[nuo] = db[c]._materiale_generale[vec]; delete db[c]._materiale_generale[vec]; } }
                if(cantiereCorrente) rendiMateriali();
            }
            salvaDati();
        }

        function eliminaVoceCatalogo() {
            let val = document.getElementById('select-modifica-voce').value; if(!val) return;
            let p = val.split("|"); let tipo = p[0]; let nom = p[1];
            if(confirm("ELIMINARE " + nom + " DAL CATALOGO?")) {
                if(tipo === 'f') {
                    catalogoFrutti = catalogoFrutti.filter(f => f[1] !== nom);
                    for(let c in db) { for(let s in db[c]._stanze) delete db[c]._stanze[s][nom]; }
                    if(stanzaCorrente) rendiFrutti();
                } else {
                    catalogoMateriali = catalogoMateriali.filter(m => m[1] !== nom);
                    for(let c in db) { if(db[c]._materiale_generale) delete db[c]._materiale_generale[nom]; }
                    if(cantiereCorrente) rendiMateriali();
                }
                salvaDati();
            }
        }

        let testoRiepilogo = "";
        function generaRiepilogoTesto() {
            if(!cantiereCorrente) return;
            let c = db[cantiereCorrente]; let t = `CANTIERE: ${cantiereCorrente.toUpperCase()}\n\n-- MATERIALE GENERALE --\n`;
            let ciMat = false;
            for(let m in c._materiale_generale) { if(c._materiale_generale[m] !== "0" && c._materiale_generale[m] !== "") { t += `${m}: ${c._materiale_generale[m]}\n`; ciMat = true; } }
            if(!ciMat) t += `NESSUN MATERIALE\n`;

            t += `\n-- FRUTTI DA ORDINARE --\n`;
            let totF = {}; let totPz = 0;
            for(let s in c._stanze) { for(let f in c._stanze[s]) { let q = c._stanze[s][f]; if(q > 0) { totF[f] = (totF[f] || 0) + q; totPz += q; } } }
            let ciFru = false;
            for(let f in totF) { t += `${f}: ${totF[f]}\n`; ciFru = true; }
            if(!ciFru) t += `NESSUN FRUTTO\n`; else t += `\nTOTALE PEZZI: ${totPz}\n`;

            t += `\n-- DETTAGLIO STANZE --\n`;
            for(let s in c._stanze) {
                t += `\n[${s}]\n`; let v = true;
                for(let f in c._stanze[s]) { if(c._stanze[s][f] > 0) { t += `${f}: ${c._stanze[s][f]}\n`; v = false; } }
                if(v) t += `(Vuota)\n`;
            }

            let bk = btoa(unescape(encodeURIComponent(JSON.stringify({db:db, f:catalogoFrutti, m:catalogoMateriali}))));
            t += `\nBACKUP:\n[BK]${bk}[/BK]`;
            
            testoRiepilogo = t;
            document.getElementById('output').innerText = t;
            document.getElementById('output-box').style.display = "block";
        }

        function inviaWhatsApp() { window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(testoRiepilogo), '_blank'); }

        function ripristinaDaBackup() {
            let i = document.getElementById('backup-string-input').value.trim();
            if(!i) return;
            try {
                if(i.includes("[BK]") && i.includes("[/BK]")) i = i.split("[BK]")[1].split("[/BK]")[0];
                let d = JSON.parse(decodeURIComponent(escape(atob(i))));
                if(confirm("SOVRASCRIVERE I DATI ATTUALI?")) {
                    db = d.db; catalogoFrutti = d.f || STRUTTURA_FRUTTI_INIZIALE; catalogoMateriali = d.m || STRUTTURA_MATERIALE_INIZIALE;
                    salvaDati(); aggiornaSelectCantieri(); caricaCantiere(); document.getElementById('backup-string-input').value = "";
                }
            } catch(e) { alert("CODICE NON VALIDO"); }
        }

        function resetTotaleApplicazione() {
            if(confirm("AZZERARE TUTTA L'APPLICAZIONE?")) {
                localStorage.clear(); db = {}; catalogoFrutti = STRUTTURA_FRUTTI_INIZIALE; catalogoMateriali = STRUTTURA_MATERIALE_INIZIALE;
                salvaDati(); aggiornaSelectCantieri(); caricaCantiere();
            }
        }
    </script>
</body>
</html>
