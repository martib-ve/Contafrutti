<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conta Frutti PRO</title>
    <style>
        :root { --bg: #000; --text: #fff; --border: #333; --accent: #fff; }
        [data-theme="light"] { --bg: #fff; --text: #000; --border: #ccc; --accent: #000; }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        
        .section-title { font-weight: 800; padding: 15px 0; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 1rem; }
        .content-area { display: none; padding: 15px 0; }
        .content-area.open { display: block; }
        
        .cat-title { font-size: 0.7rem; font-weight: 900; color: #888; margin-top: 15px; text-transform: uppercase; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; }
        
        button { padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
        input { width: 100%; padding: 10px; background: #111; border: 1px solid var(--border); color: #fff; border-radius: 6px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header style="display:flex; justify-content:space-between; margin-bottom:20px;">
        <h1 style="font-size: 1.2rem;">CANTIERE</h1>
        <button onclick="toggleTema()">☀️/🌙</button>
    </header>

    <div class="section">
        <div class="section-title" onclick="toggleSection('mat-content')">MATERIALE GENERALE <span>▼</span></div>
        <div id="mat-content" class="content-area">
            <div id="lista-materiali"></div>
        </div>
    </div>

    <div class="section">
        <div class="section-title" onclick="toggleSection('stanze-content')">STANZE <span>▼</span></div>
        <div id="stanze-content" class="content-area">
            <div id="lista-stanze"></div>
            <div style="margin-top: 20px;">
                <input type="text" id="nuova-stanza" placeholder="NOME NUOVA STANZA...">
                <button onclick="creaStanza()" style="width:100%; font-weight:bold;">AGGIUNGI STANZA</button>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title" onclick="toggleSection('manutenzione-content')" style="font-size: 0.8rem; color: #888;">MANUTENZIONE CATALOGO <span>▼</span></div>
        <div id="manutenzione-content" class="content-area">
            <button onclick="resetData()" style="color:red; width:100%;">RIPRISTINA DATI</button>
        </div>
    </div>

    <script>
        // Logica base
        function toggleSection(id) { document.getElementById(id).classList.toggle('open'); }
        function toggleTema() { document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); }
        
        function creaStanza() {
            let nome = document.getElementById('nuova-stanza').value;
            if(nome) {
                // Inserire qui logica di salvataggio
                alert("Stanza " + nome + " aggiunta!");
                document.getElementById('nuova-stanza').value = "";
            }
        }

        function resetData() { if(confirm("Cancellare tutto?")) localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
