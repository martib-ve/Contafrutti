<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conta Frutti Pro</title>
    <style>
        :root { --bg-body: #000; --bg-input: #111; --text-main: #fff; --text-muted: #777; --border: #222; --accent: #fff; }
        [data-theme="light"] { --bg-body: #fff; --bg-input: #f4f4f4; --text-main: #000; --text-muted: #888; --border: #ddd; --accent: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); color: var(--text-main); padding: 15px; padding-bottom: 80px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section { margin-bottom: 25px; }
        select, input { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px; margin-bottom: 10px; }
        .btn-tab { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-main); font-weight: 600; flex: 1; }
        .btn-active { background: var(--accent); color: var(--bg-body); }
        .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .stepper { display: flex; align-items: center; gap: 15px; }
        .btn-step { width: 40px; height: 40px; border-radius: 8px; border: none; background: var(--border); color: var(--text-main); font-size: 1.2rem; }
    </style>
</head>
<body>

<header>
    <h1>Conta Frutti</h1>
    <button onclick="toggleTema()" style="background:none; border:none; color:var(--text-main);">☀️/🌙</button>
</header>

<div class="section">
    <select id="cantiere-select" onchange="caricaCantiere()"></select>
    <div style="display:flex; gap:10px;">
        <button id="tab-frutti" class="btn-tab btn-active" onclick="mostraTab('frutti')">Stanze</button>
        <button id="tab-materiali" class="btn-tab" onclick="mostraTab('materiali')">Materiali</button>
    </div>
</div>

<div id="view-frutti">
    <div class="section">
        <div id="lista-stanze"></div>
        <div style="display:flex; gap:10px;">
            <input type="text" id="nuova-stanza" placeholder="Nome stanza...">
            <button onclick="creaStanza()" style="width:50px; background:var(--accent); border:none; border-radius:8px;">+</button>
        </div>
    </div>
    <div id="sec-conteggio" class="section" style="display:none;">
        <h2 id="titolo-stanza" style="font-size:0.9rem; margin-bottom:10px;"></h2>
        <div id="lista-frutti"></div>
    </div>
</div>

<div id="view-materiali" class="section" style="display:none;">
    <div id="lista-materiali"></div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('data')) || { "Cantiere 1": { stanze: {}, materiali: {} } };
    let cantiere = Object.keys(db)[0];
    let stanza = "";

    function save() { localStorage.setItem('data', JSON.stringify(db)); }
    
    function toggleTema() {
        let t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
    }

    function mostraTab(t) {
        document.getElementById('view-frutti').style.display = t === 'frutti' ? 'block' : 'none';
        document.getElementById('view-materiali').style.display = t === 'materiali' ? 'block' : 'none';
        document.getElementById('tab-frutti').className = 'btn-tab ' + (t === 'frutti' ? 'btn-active' : '');
        document.getElementById('tab-materiali').className = 'btn-tab ' + (t === 'materiali' ? 'btn-active' : '');
    }

    function caricaCantiere() {
        cantiere = document.getElementById('cantiere-select').value;
        renderStanze(); renderMateriali();
    }

    function creaStanza() {
        let n = document.getElementById('nuova-stanza').value;
        if(n) { db[cantiere].stanze[n] = {}; save(); renderStanze(); document.getElementById('nuova-stanza').value = ""; }
    }

    function renderStanze() {
        let l = document.getElementById('lista-stanze'); l.innerHTML = "";
        Object.keys(db[cantiere].stanze).forEach(s => {
            l.innerHTML += `<div class="row" onclick="apriStanza('${s}')">${s} <span>></span></div>`;
        });
    }

    function apriStanza(s) {
        stanza = s;
        document.getElementById('sec-conteggio').style.display = 'block';
        document.getElementById('titolo-stanza').innerText = "Stanza: " + s;
        // Qui dovresti generare la lista frutti basata sul tuo catalogo
    }

    function renderMateriali() {
        let l = document.getElementById('lista-materiali'); l.innerHTML = "";
        // Esempio logica rendering materiali con autosalvataggio
        // l.innerHTML += `<div class="row">... <button onclick="modifica('Mat1', 1)">+</button></div>`
    }

    // Inizializzazione select cantieri
    let s = document.getElementById('cantiere-select');
    Object.keys(db).forEach(c => s.innerHTML += `<option>${c}</option>`);
    caricaCantiere();
</script>
</body>
</html>
