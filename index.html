<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conta Frutti</title>
    
    <link class="apple-touch-icon" rel="apple-touch-icon" href="https://img.icons8.com/fluid/512/flash-on.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluid/512/flash-on.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-body: #121212; --bg-section: #1e1e1e; --text-main: #f8fafc; --text-muted: #94a3b8;
            --border-color: #334155; --primary: #3b82f6; --secondary: #0ea5e9; --success: #16a34a;
            --danger: #dc2626; --bg-category: #334155; --bg-item: #1e293b; --bg-input: #0f172a;
        }
        [data-theme="light"] {
            --bg-body: #f8fafc; --bg-section: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
            --border-color: #cbd5e1; --primary: #2563eb; --secondary: #0ea5e9; --bg-category: #e2e8f0;
            --bg-item: #f1f5f9; --bg-input: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 15px; padding-bottom: 80px; transition: background-color 0.3s, color 0.3s; }
        header { margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.5rem; color: var(--primary); }
        .section { background: var(--bg-section); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        h2 { font-size: 1.1rem; margin-bottom: 10px; }
        
        /* Griglia Pulsantiera */
        .griglia-frutti { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 15px; }
        .card-frutto { background: var(--bg-item); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .card-nome { font-size: 0.9rem; font-weight: bold; text-align: center; height: 2.4em; display: flex; align-items: center; }
        .valore-gigante { font-size: 2rem; font-weight: 800; color: var(--primary); }
        .btn-pulsantiera { width: 60px; height: 60px; font-size: 1.8rem; border-radius: 50%; border: none; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; }
        
        .collapsible-trigger { background: var(--secondary); color: white; padding: 12px; border-radius: 6px; font-weight: bold; display: flex; justify-content: space-between; cursor: pointer; margin-bottom: 10px; }
        .collapsible-content { display: none; margin-top: 10px; }
        .collapsible-content.active { display: block; }
        select, input { width: 100%; padding: 12px; margin: 5px 0 10px 0; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-input); color: var(--text-main); }
        button { padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .stanza-item { background: var(--bg-item); padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #ccc; flex-shrink: 0; }
    </style>
</head>
<body>

    <header>
        <h1>Conta Frutti</h1>
        <div style="display: flex; gap: 10px;">
            <button id="btn-tema" onclick="toggleTema()" style="width: auto; padding: 6px; background: var(--bg-item); color: var(--text-main);">☀️</button>
            <button onclick="resetTotaleApplicazione()" class="btn-danger" style="width: auto; padding: 6px;">Reset</button>
        </div>
    </header>

    <div class="section">
        <h2>Cantieri</h2>
        <select id="cantiere-select" onchange="caricaCantiere()"></select>
        <input type="text" id="nuovo-cantiere-nome" placeholder="Nome nuovo cantiere...">
        <button onclick="creaCantiere()" class="btn-success" style="width:100%;">+ Aggiungi Cantiere</button>
    </div>

    <div class="section" id="sec-materiale-generale" style="display:none;">
        <div class="collapsible-trigger" onclick="toggleCollapsible('content-mat')">Materiale Generale <span>▼</span></div>
        <div id="content-mat" class="collapsible-content">
            <div id="lista-materiali-generali" class="griglia-frutti"></div>
            <button onclick="salvaMaterialeGenerale()" class="btn-success" style="margin-top:15px; width:100%;">Salva Materiale</button>
        </div>
    </div>

    <div class="section" id="sec-stanze" style="display:none;">
        <h2>Stanze</h2>
        <div id="lista-stanze-salvate"></div>
        <input type="text" id="nuova-stanza-nome" placeholder="Nome nuova stanza...">
        <button onclick="creaStanza()" class="btn-success" style="width:100%;">+ Aggiungi Stanza</button>
    </div>

    <div class="section" id="sec-conteggio" style="display:none;">
        <h2 id="titolo-conteggio-stanza"></h2>
        <div id="lista-frutti-conteggio"></div>
        <button onclick="salvaConteggioStanza()" class="btn-success" style="margin-top:15px; width:100%;">Salva Stanza</button>
    </div>

    <script>
        function inizializzaTema() { document.documentElement.setAttribute('data-theme', localStorage.getItem('cf_tema') || 'dark'); }
        function toggleTema() { 
            let nuovo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', nuovo); localStorage.setItem('cf_tema', nuovo); 
        }
        function toggleCollapsible(id) { document.getElementById(id).classList.toggle('active'); }
        function generaIdSicuro(nome) { return "id-" + nome.toLowerCase().replace(/[^a-z0-9]/g, "-"); }
        
        let catalogoFrutti = JSON.parse(localStorage.getItem('cf_v9_cat_frutti')) || [["Comandi", "Interruttore"], ["Prese", "Presa 16A"]];
        let catalogoMateriali = JSON.parse(localStorage.getItem('cf_v9_cat_mat')) || [["Cordine", "Cordina 1.5 Blu"], ["Cordine", "Cordina 1.5 Marrone"]];
        let db = JSON.parse(localStorage.getItem('cf_v9_db')) || {};
        let cantiereCorrente = "", stanzaCorrente = "", conteggioTemporaneo = {}, materialiTemporanei = {};

        function ottieniTagColore(nome) {
            let n = nome.toLowerCase();
            if (n.includes("giallo/verde") || n.includes("terra")) return '<span class="color-dot" style="background:#eab308; border-right:none; border-radius: 20px 0 0 20px;"></span><span class="color-dot" style="background:#22c55e; border-left:none; border-radius: 0 20px 20px 0;"></span>';
            let colori = { "nero": "#1e293b", "blu": "#2563eb", "marrone": "#78350f", "grigio": "#64748b", "rosso": "#dc2626", "viola": "#7c3aed", "bianco": "#ffffff" };
            for (let c in colori) if (n.includes(c)) return `<span class="color-dot" style="background:${colori[c]}"></span>`;
            return '';
        }

        function renderingListaMateriali() {
            const container = document.getElementById('lista-materiali-generali');
            container.innerHTML = "";
            catalogoMateriali.forEach(m => {
                let nomeCompleto = m[1];
                let nomeVisualizzato = m[0].includes("Cordine") ? nomeCompleto.split(" ").pop() : nomeCompleto;
                container.innerHTML += `
                    <div class="card-frutto">
                        <div style="display:flex; align-items:center; gap:8px;">${ottieniTagColore(nomeCompleto)} <span class="card-nome">${nomeVisualizzato}</span></div>
                        <span class="valore-gigante" id="mat-${generaIdSicuro(nomeCompleto)}">${materialiTemporanei[nomeCompleto] || 0}</span>
                        <div style="display:flex; gap:10px;">
                            <button class="btn-pulsantiera btn-danger" onclick="cambiaQtaMateriale('${nomeCompleto}', -1)">-</button>
                            <button class="btn-pulsantiera btn-success" onclick="cambiaQtaMateriale('${nomeCompleto}', 1)">+</button>
                        </div>
                    </div>`;
            });
        }

        function renderingListaFrutti() {
            const container = document.getElementById('lista-frutti-conteggio');
            container.innerHTML = '<div class="griglia-frutti"></div>';
            const grid = container.querySelector('.griglia-frutti');
            catalogoFrutti.forEach(f => {
                let nome = f[1];
                grid.innerHTML += `
                    <div class="card-frutto">
                        <span class="card-nome">${nome}</span>
                        <span class="valore-gigante" id="val-${generaIdSicuro(nome)}">${conteggioTemporaneo[nome] || 0}</span>
                        <div style="display:flex; gap:10px;">
                            <button class="btn-pulsantiera btn-danger" onclick="cambiaQta('${nome}', -1)">-</button>
                            <button class="btn-pulsantiera btn-success" onclick="cambiaQta('${nome}', 1)">+</button>
                        </div>
                    </div>`;
            });
        }

        // --- GESTIONE LOGICA ---
        window.onload = () => { inizializzaTema(); aggiornaSelectCantieri(); };
        function salvaNelStorage() { localStorage.setItem('cf_v9_db', JSON.stringify(db)); }
        function aggiornaSelectCantieri() { 
            const s = document.getElementById('cantiere-select'); s.innerHTML = "";
            Object.keys(db).forEach(c => s.innerHTML += `<option value="${c}">${c}</option>`);
        }
        function creaCantiere() { let n = document.getElementById('nuovo-cantiere-nome').value; if(n) { db[n] = {_stanze:{}}; salvaNelStorage(); aggiornaSelectCantieri(); } }
        function caricaCantiere() { 
            cantiereCorrente = document.getElementById('cantiere-select').value;
            document.getElementById('sec-materiale-generale').style.display = "block";
            document.getElementById('sec-stanze').style.display = "block";
            renderingListaMateriali();
        }
        function cambiaQtaMateriale(nome, val) { 
            materialiTemporanei[nome] = Math.max(0, (parseInt(materialiTemporanei[nome]||0) + val));
            document.getElementById('mat-' + generaIdSicuro(nome)).innerText = materialiTemporanei[nome];
        }
        function cambiaQta(nome, val) { 
            conteggioTemporaneo[nome] = Math.max(0, (parseInt(conteggioTemporaneo[nome]||0) + val));
            document.getElementById('val-' + generaIdSicuro(nome)).innerText = conteggioTemporaneo[nome];
        }
        function creaStanza() { let n = document.getElementById('nuova-stanza-nome').value; if(n) { db[cantiereCorrente]._stanze[n] = {}; salvaNelStorage(); } }
        function salvaConteggioStanza() { alert("Stanza salvata!"); }
        function salvaMaterialeGenerale() { alert("Materiale salvato!"); }
        function resetTotaleApplicazione() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
