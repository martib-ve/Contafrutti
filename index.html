<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conta Frutti</title>
    
    <link class="apple-touch-icon" rel="apple-touch-icon" href="https://img.icons8.com/fluid/512/flash-on.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluid/512/flash-on.png">
    <link rel="manifest" href="manifest.json">

    <style>
        /* TEMA SCURO (OLED BLACK) - MASSIMO RISPARMIO ENERGETICO E CONTRASTO */
        :root {
            --bg-body: #000000;
            --bg-input: #111111;
            --bg-stepper: #1a1a1a;
            
            --text-main: #ffffff;
            --text-muted: #666666;
            --border-color: #222222;
            
            --btn-primary-bg: #ffffff;
            --btn-primary-text: #000000;
            
            --btn-secondary-bg: transparent;
            --btn-secondary-text: #ffffff;
            --btn-secondary-border: #333333;
        }

        /* TEMA CHIARO - PURA LUCE */
        [data-theme="light"] {
            --bg-body: #ffffff;
            --bg-input: #f4f4f5;
            --bg-stepper: #f4f4f5;
            
            --text-main: #000000;
            --text-muted: #888888;
            --border-color: #e4e4e7;
            
            --btn-primary-bg: #000000;
            --btn-primary-text: #ffffff;
            
            --btn-secondary-bg: transparent;
            --btn-secondary-text: #000000;
            --btn-secondary-border: #d4d4d8;
        }

        /* TYPOGRAPHY & RESET MINIMALE */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 20px 15px 80px 15px; transition: background-color 0.2s, color 0.2s; -webkit-font-smoothing: antialiased; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; }
        h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }
        
        .section { margin-bottom: 35px; }
        h2 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        
        /* INPUT & PULSANTI PURI */
        select, input { width: 100%; padding: 14px; margin: 5px 0 15px 0; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; background: var(--bg-input); color: var(--text-main); -webkit-appearance: none; outline: none; }
        select:focus, input:focus { border-color: var(--text-muted); }
        
        button { width: 100%; padding: 14px; margin: 5px 0 10px 0; border-radius: 8px; font-size: 1rem; font-weight: 600; border: none; cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:active { opacity: 0.7; transform: scale(0.98); }
        
        .btn-primary { background-color: var(--btn-primary-bg); color: var(--btn-primary-text); }
        .btn-secondary { background-color: var(--btn-secondary-bg); color: var(--btn-secondary-text); border: 1px solid var(--btn-secondary-border); }
        
        /* HEADER ESPANDIBILI */
        .collapsible-trigger { background: transparent; color: var(--text-main); padding: 15px 0; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 5px; }
        .collapsible-content { display: none; margin-top: 10px; }
        .collapsible-content.active { display: block; }
        
        .stanza-item { padding: 15px 0; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .stanza-item button { width: auto; padding: 6px 12px; margin: 0; font-size: 0.85rem; font-weight: 500; }

        /* LISTA MATERIALI/FRUTTI ULTRA PIATTA */
        .griglia-pulsantiera { display: flex; flex-direction: column; }
        .category-row { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 25px 0 8px 0; border-bottom: 1px solid var(--border-color); }
        
        .list-row { display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .row-nome { font-size: 1rem; font-weight: 400; color: var(--text-main); line-height: 1.3; }
        
        /* CONTROLLI +/- */
        .controls-layout { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
        .btn-stepper { width: 44px; height: 44px; font-size: 1.5rem; font-weight: 400; border-radius: 8px; padding: 0; margin: 0; display: flex; align-items: center; justify-content: center; background: var(--bg-stepper); color: var(--text-main); border: none; }
        .valore-stepper { font-size: 1.4rem; font-weight: 600; color: var(--text-main); min-width: 34px; text-align: center; cursor: pointer; }
        
        /* PALLINI COLORI CORDINE (Con bordo sottile per contrastare lo sfondo nero) */
        .color-dot { display: inline-block; width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; border: 1px solid var(--border-color); }
        .dot-nero { background-color: #111111; }
        .dot-blu { background-color: #3b82f6; border: none; }
        .dot-marrone { background-color: #78350f; border: none; }
        .dot-grigio { background-color: #6b7280; border: none; }
        .dot-rosso { background-color: #ef4444; border: none; }
        .dot-viola { background-color: #8b5cf6; border: none; }
        .dot-bianco { background-color: #ffffff; }
        .dot-terra-g { background-color: #eab308; border-radius: 20px 0 0 20px; border-right: none;}
        .dot-terra-v { background-color: #22c55e; border-radius: 0 20px 20px 0; border-left: none;}

        #output { white-space: pre-wrap; background: var(--bg-input); color: var(--text-main); padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; margin-top: 15px; overflow-x: auto; border: 1px solid var(--border-color); }
        
        /* Modal Minimal */
        .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .modal-box { background: var(--bg-body); padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <header>
        <h1>Conta Frutti</h1>
        <div style="display: flex; gap: 8px;">
            <button id="btn-tema" onclick="toggleTema()" class="btn-secondary" style="width: auto; padding: 8px 12px; font-size: 0.85rem; margin: 0; border: none;">☀️</button>
            <button onclick="resetTotaleApplicazione()" class="btn-secondary" style="width: auto; padding: 8px 12px; font-size: 0.85rem; margin: 0; border: none;">Reset</button>
        </div>
    </header>

    <div class="section">
        <h2>Gestione Cantiere</h2>
        <select id="cantiere-select" onchange="caricaCantiere()"></select>
        
        <div style="margin-top: 15px;">
            <input type="text" id="nuovo-cantiere-nome" placeholder="Nome nuovo cantiere...">
            <button onclick="creaCantiere(event)" class="btn-secondary">Aggiungi Cantiere</button>
        </div>
        
        <button onclick="eliminaCantiereCorrente()" class="btn-secondary" style="margin-top:20px; color: #ef4444; border-color: #ef4444;">Elimina Questo Cantiere</button>
    </div>

    <div class="section" id="sec-materiale-generale" style="display:none;">
        <div class="collapsible-trigger" onclick="toggleCollapsible('content-mat')">
            Materiale Generale
            <span style="font-size: 0.8rem; font-weight:normal; color: var(--text-muted);" id="indicator-content-mat">Espandi ▼</span>
        </div>
        
        <div id="content-mat" class="collapsible-content">
            <div id="lista-materiali-generali" class="griglia-pulsantiera"></div>
            
            <div style="margin-top: 25px;">
                <input type="text" id="nuovo-materiale-nome" placeholder="Aggiungi voce mancante...">
                <button onclick="apriModalAggiunta('materiale')" class="btn-secondary">Inserisci a Catalogo</button>
            </div>
            <button onclick="salvaMaterialeGenerale()" class="btn-primary" style="margin-top:20px; padding: 18px;">Salva Materiale Generale</button>
        </div>
    </div>

    <div class="section" id="sec-stanze" style="display:none;">
        <h2>Stanze: <span id="nome-cantiere-titolo" style="font-weight:normal; color:var(--text-muted);"></span></h2>
        <div id="lista-stanze-salvate"></div>
        
        <div style="margin-top:20px;">
            <input type="text" id="nuova-stanza-nome" placeholder="Es. Cucina, Bagno, Garage...">
            <button onclick="creaStanza()" class="btn-secondary">Aggiungi Stanza</button>
        </div>
    </div>

    <div class="section" id="sec-conteggio" style="display:none;">
        <div class="collapsible-trigger" onclick="toggleCollapsible('content-frutti')">
            <span id="titolo-conteggio-stanza">Conteggio</span>
            <span style="font-size: 0.8rem; font-weight:normal; color: var(--text-muted);">Aperto ▼</span>
        </div>

        <div id="content-frutti" class="collapsible-content">
            <div id="lista-frutti-conteggio" class="griglia-pulsantiera"></div>

            <div style="margin-top: 25px;">
                <input type="text" id="nuovo-frutto-nome" placeholder="Aggiungi voce mancante...">
                <button onclick="apriModalAggiunta('frutto')" class="btn-secondary">Inserisci a Catalogo</button>
            </div>

            <button onclick="salvaConteggioStanza()" class="btn-primary" style="margin-top:25px; padding: 18px;">Salva Questa Stanza</button>
        </div>
    </div>

    <div class="section">
        <h2>Manutenzione Catalogo</h2>
        <select id="select-modifica-voce"></select>
        <div style="display: flex; gap: 10px;">
            <button onclick="rinominaVoceCatalogo()" class="btn-secondary">Rinomina</button>
            <button onclick="eliminaVoceCatalogo()" class="btn-secondary" style="color: #ef4444; border-color: #ef4444;">Elimina</button>
        </div>
    </div>

    <div class="section" id="sec-riepilogo" style="display:none;">
        <h2>Esporta Dati</h2>
        <button onclick="generaRiepilogoTesto()" class="btn-primary">Genera Riepilogo</button>
        <div id="output-box" style="display:none; margin-top:20px;">
            <button onclick="inviaWhatsApp()" class="btn-secondary" style="color: #22c55e; border-color: #22c55e;">Invia su WhatsApp</button>
            <div id="output"></div>
        </div>
    </div>

    <div class="section">
        <h2>Ripristino</h2>
        <input type="text" id="backup-string-input" placeholder="Incolla codice...">
        <button onclick="ripristinaDaBackup()" class="btn-secondary">Ripristina Backup</button>
    </div>

    <div id="modal-categoria" class="modal-bg">
        <div class="modal-box">
            <h3 id="modal-titolo" style="margin-bottom: 20px; font-weight: 500;">Seleziona Categoria</h3>
            <select id="modal-select-cat" onchange="gestisciCambioModalSelect()"></select>
            <input type="text" id="modal-nuova-cat-input" placeholder="Scrivi nuova categoria..." style="display:none;">
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="chiudiModalAggiunta()" class="btn-secondary">Annulla</button>
                <button onclick="confermaAggiuntaElemento()" class="btn-primary">Conferma</button>
            </div>
        </div>
    </div>

    <script>
        function inizializzaTema() {
            let temaSalvato = localStorage.getItem('cf_tema') || 'dark';
            document.documentElement.setAttribute('data-theme', temaSalvato);
            aggiornaTestoPulsanteTema(temaSalvato);
        }

        function toggleTema() {
            let temaAttuale = document.documentElement.getAttribute('data-theme') || 'dark';
            let nuovoTema = temaAttuale === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', nuovoTema);
            localStorage.setItem('cf_tema', nuovoTema);
            aggiornaTestoPulsanteTema(nuovoTema);
        }

        function aggiornaTestoPulsanteTema(tema) {
            let btn = document.getElementById('btn-tema');
            if (btn) btn.innerText = tema === 'dark' ? '☀️' : '🌙';
        }

        const ORDINE_CATEGORIE_FRUTTI = ["Supporti e Scatole", "Comandi", "Prese energia e dati", "Centralino", "Varie"];
        const ORDINE_CATEGORIE_MATERIALE = ["Cordine 1.5 mm²", "Cordine 2.5 mm²", "Cordine 4 mm²", "Tubi e Corrugati", "Materiale Consumo"];

        const STRUTTURA_FRUTTI_INIZIALE = [
            ["Supporti e Scatole", "Supporto / Scatola 503"], ["Supporti e Scatole", "Supporto / Scatola 504"], ["Supporti e Scatole", "Supporto / Scatola 506"], ["Supporti e Scatole", "Scatola esterna 503"], ["Supporti e Scatole", "Scatola 503/703 Cartongesso"], ["Supporti e Scatole", "Coperchio 503"],
            ["Comandi", "Interruttore"], ["Comandi", "Deviatore"], ["Comandi", "Invertitore"], ["Comandi", "Pulsante"], ["Comandi", "Commutatore Tapparella/Tenda"], ["Comandi", "Interruttore Bipolare"],
            ["Prese energia e dati", "Presa 10A"], ["Prese energia e dati", "Presa 16A"], ["Prese energia e dati", "Presa Schuko"], ["Prese energia e dati", "Presa Dati (RJ45)"], ["Prese energia e dati", "Presa TV Passante"], ["Prese energia e dati", "Presa TV Terminale/Finale"],
            ["Centralino", "Centralino 18 Moduli"], ["Centralino", "Centralino: Sezionatore 32A"], ["Centralino", "Centralino: Salvavita 25A"], ["Centralino", "Centralino: Salvavita 10A"], ["Centralino", "Centralino: Magnetotermico 16A"], ["Centralino", "Centralino: Magnetotermico 25A"],
            ["Varie", "Tappo Copriforo"], ["Varie", "Emergenza Estraibile"]
        ];

        const STRUTTURA_MATERIALE_INIZIALE = [
            ["Cordine 1.5 mm²", "Cordina 1.5 Marrone"], ["Cordine 1.5 mm²", "Cordina 1.5 Grigio"], ["Cordine 1.5 mm²", "Cordina 1.5 Nero"], ["Cordine 1.5 mm²", "Cordina 1.5 Bianco"], ["Cordine 1.5 mm²", "Cordina 1.5 Blu"], ["Cordine 1.5 mm²", "Cordina 1.5 Rosso"], ["Cordine 1.5 mm²", "Cordina 1.5 Viola"], ["Cordine 1.5 mm²", "Cordina 1.5 Giallo/Verde (Terra)"],
            ["Cordine 2.5 mm²", "Cordina 2.5 Marrone"], ["Cordine 2.5 mm²", "Cordina 2.5 Blu"], ["Cordine 2.5 mm²", "Cordina 2.5 Giallo/Verde (Terra)"],
            ["Cordine 4 mm²", "Cordina 4 Marrone"], ["Cordine 4 mm²", "Cordina 4 Blu"], ["Cordine 4 mm²", "Cordina 4 Giallo/Verde (Terra)"],
            ["Tubi e Corrugati", "Tubo Corrugato Ø 16 mm"], ["Tubi e Corrugati", "Tubo Corrugato Ø 20 mm"], ["Tubi e Corrugati", "Tubo Corrugato Ø 25 mm"], ["Tubi e Corrugati", "Tubo Corrugato Ø 32 mm"],
            ["Materiale Consumo", "Nastro Isolante"], ["Materiale Consumo", "Fascette Cablaggio"]
        ];

        let catalogoFrutti = JSON.parse(localStorage.getItem('cf_v9_cat_frutti')) || STRUTTURA_FRUTTI_INIZIALE;
        let catalogoMateriali = JSON.parse(localStorage.getItem('cf_v9_cat_mat')) || STRUTTURA_MATERIALE_INIZIALE;
        let db = JSON.parse(localStorage.getItem('cf_v9_db')) || {};
        
        let cantiereCorrente = "", stanzaCorrente = "", conteggioTemporaneo = {}, materialiTemporanei = {}, tipoAggiuntaCorrente = ""; 

        window.onload = function() {
            inizializzaTema();
            aggiornaSelectCantieri();
            let ultimi = Object.keys(db);
            if(ultimi.length > 0) document.getElementById('cantiere-select').value = ultimi[0];
            caricaCantiere();
            aggiornaSelectManutenzioneCatalogo();
        };

        function salvaNelStorage() {
            localStorage.setItem('cf_v9_db', JSON.stringify(db));
            localStorage.setItem('cf_v9_cat_frutti', JSON.stringify(catalogoFrutti));
            localStorage.setItem('cf_v9_cat_mat', JSON.stringify(catalogoMateriali));
            aggiornaSelectManutenzioneCatalogo();
        }

        function toggleCollapsible(id) {
            const el = document.getElementById(id);
            el.classList.toggle('active');
        }

        function generaIdSicuro(nome) {
            return "id-" + nome.toLowerCase().replace(/[^a-z0-9]/g, "-");
        }

        function ottieniTagColore(nomeFlusso) {
            let nome = nomeFlusso.toLowerCase();
            if (nome.includes("giallo/verde") || nome.includes("terra")) return '<div style="display:flex;"><span class="color-dot dot-terra-g"></span><span class="color-dot dot-terra-v"></span></div>';
            if (nome.includes("nero")) return '<span class="color-dot dot-nero"></span>';
            if (nome.includes("blu")) return '<span class="color-dot dot-blu"></span>';
            if (nome.includes("marrone")) return '<span class="color-dot dot-marrone"></span>';
            if (nome.includes("grigio")) return '<span class="color-dot dot-grigio"></span>';
            if (nome.includes("rosso")) return '<span class="color-dot dot-rosso"></span>';
            if (nome.includes("viola")) return '<span class="color-dot dot-viola"></span>';
            if (nome.includes("bianco")) return '<span class="color-dot dot-bianco"></span>';
            return '';
        }

        function getIndiceCategoria(cat, arrayOrdine) {
            let idx = arrayOrdine.indexOf(cat); return idx === -1 ? 999 : idx;
        }

        function ordinaCatalogoFrutti(catalogo) {
            catalogo.sort((a, b) => {
                let idxA = getIndiceCategoria(a[0]||"", ORDINE_CATEGORIE_FRUTTI);
                let idxB = getIndiceCategoria(b[0]||"", ORDINE_CATEGORIE_FRUTTI);
                if(idxA !== idxB) return idxA - idxB;
                return a[1].localeCompare(b[1]);
            });
        }
        
        function ordinaCatalogoMateriali(catalogo) {
            catalogo.sort((a, b) => {
                let idxA = getIndiceCategoria(a[0]||"", ORDINE_CATEGORIE_MATERIALE);
                let idxB = getIndiceCategoria(b[0]||"", ORDINE_CATEGORIE_MATERIALE);
                if(idxA !== idxB) return idxA - idxB;
                if((a[0]||"").toLowerCase().includes("cordine")) return 0;
                return a[1].localeCompare(b[1]);
            });
        }

        function apriModalAggiunta(tipo) {
            tipoAggiuntaCorrente = tipo;
            let inputNome = document.getElementById(tipo === 'frutto' ? 'nuovo-frutto-nome' : 'nuovo-materiale-nome');
            let nome = inputNome.value.trim();
            if (!nome) return alert("Inserisci prima il nome del componente!");

            if (tipo === 'frutto' && catalogoFrutti.some(f => f[1].toLowerCase() === nome.toLowerCase())) return alert("Questo frutto esiste già nel catalogo!");
            if (tipo === 'materiale' && catalogoMateriali.some(m => m[1].toLowerCase() === nome.toLowerCase())) return alert("Questo materiale esiste già nel catalogo!");

            document.getElementById('modal-titolo').innerText = tipo === 'frutto' ? "Seleziona Categoria Frutto" : "Seleziona Categoria Materiale";
            
            let selectCat = document.getElementById('modal-select-cat'); selectCat.innerHTML = "";
            let categorieEsistenti = [];
            let sorgente = tipo === 'frutto' ? catalogoFrutti : catalogoMateriali;
            sorgente.forEach(item => { if(item[0] && !categorieEsistenti.includes(item[0])) categorieEsistenti.push(item[0]); });

            let arrayOrdineRif = tipo === 'frutto' ? ORDINE_CATEGORIE_FRUTTI : ORDINE_CATEGORIE_MATERIALE;
            categorieEsistenti.sort((a,b) => getIndiceCategoria(a, arrayOrdineRif) - getIndiceCategoria(b, arrayOrdineRif));

            categorieEsistenti.forEach(cat => { let opt = document.createElement('option'); opt.value = cat; opt.innerText = cat; selectCat.appendChild(opt); });
            let optNuova = document.createElement('option'); optNuova.value = "__NEW__"; optNuova.innerText = "[ + Crea Nuova Categoria ]"; selectCat.appendChild(optNuova);

            document.getElementById('modal-nuova-cat-input').style.display = "none";
            document.getElementById('modal-nuova-cat-input').value = "";
            document.getElementById('modal-categoria').style.display = "flex";
        }

        function gestisciCambioModalSelect() {
            let select = document.getElementById('modal-select-cat'); let inputNuova = document.getElementById('modal-nuova-cat-input');
            if (select.value === "__NEW__") { inputNuova.style.display = "block"; inputNuova.focus(); } else { inputNuova.style.display = "none"; }
        }

        function chiudiModalAggiunta() { document.getElementById('modal-categoria').style.display = "none"; }

        function confermaAggiuntaElemento() {
            let select = document.getElementById('modal-select-cat'); let inputNuova = document.getElementById('modal-nuova-cat-input');
            let categoriaFinale = select.value === "__NEW__" ? inputNuova.value.trim() : select.value;
            if (select.value === "__NEW__" && !categoriaFinale) return alert("Scrivi il nome della nuova categoria!");

            if (tipoAggiuntaCorrente === 'frutto') {
                let inputNome = document.getElementById('nuovo-frutto-nome'); let nome = inputNome.value.trim();
                catalogoFrutti.push([categoriaFinale, nome]); ordinaCatalogoFrutti(catalogoFrutti); conteggioTemporaneo[nome] = 0; inputNome.value = ""; salvaNelStorage(); renderingListaFrutti();
            } else {
                let inputNome = document.getElementById('nuovo-materiale-nome'); let nome = inputNome.value.trim();
                catalogoMateriali.push([categoriaFinale, nome]); ordinaCatalogoMateriali(catalogoMateriali); materialiTemporanei[nome] = "0"; inputNome.value = ""; salvaNelStorage(); renderingListaMateriali();
            }
            chiudiModalAggiunta();
        }

        function aggiornaSelectManutenzioneCatalogo() {
            let select = document.getElementById('select-modifica-voce'); if(!select) return; select.innerHTML = "";
            let optG1 = document.createElement('optgroup'); optG1.label = "FRUTTI";
            catalogoFrutti.forEach(f => { let opt = document.createElement('option'); opt.value = "frutto|" + f[1]; opt.innerText = `[${f[0]}] ${f[1]}`; optG1.appendChild(opt); }); select.appendChild(optG1);
            let optG2 = document.createElement('optgroup'); optG2.label = "MATERIALE CANTIERE";
            catalogoMateriali.forEach(m => { let opt = document.createElement('option'); opt.value = "materiale|" + m[1]; opt.innerText = `[${m[0] || 'Varie'}] ${m[1]}`; optG2.appendChild(opt); }); select.appendChild(optG2);
        }

        function rinominaVoceCatalogo() {
            let selectVal = document.getElementById('select-modifica-voce').value; if(!selectVal) return;
            let parti = selectVal.split("|"); let tipo = parti[0]; let vecchioNome = parti[1];
            let nuovoNome = prompt(`Modifica il nome per:\n${vecchioNome}`, vecchioNome);
            if (!nuovoNome || nuovoNome.trim() === "" || nuovoNome.trim() === vecchioNome) return;
            nuovoNome = nuovoNome.trim();

            if (tipo === 'frutto') {
                catalogoFrutti.forEach(f => { if(f[1] === vecchioNome) f[1] = nuovoNome; }); ordinaCatalogoFrutti(catalogoFrutti);
