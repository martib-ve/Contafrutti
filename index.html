<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conta Frutti Pro</title>
    <style>
        :root { --bg-body: #000; --bg-input: #111; --text-main: #fff; --text-muted: #777; --border: #222; --accent: #fff; }
        [data-theme="light"] { --bg-body: #fff; --bg-input: #f4f4f4; --text-main: #000; --text-muted: #888; --border: #ddd; --accent: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); color: var(--text-main); padding: 15px; padding-bottom: 80px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section { margin-bottom: 15px; }
        select, input, textarea { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px; margin-bottom: 10px; font-size: 1rem; }
        .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .stepper { display: flex; align-items: center; gap: 15px; }
        .btn-step { width: 40px; height: 40px; border-radius: 8px; border: none; background: var(--border); color: var(--text-main); font-size: 1.2rem; cursor: pointer; }
        .qta-val { font-size: 1.2rem; font-weight: bold; min-width: 30px; text-align: center; }
        
        /* Stili Gerarchia */
        .titolo-principale { font-weight: 800; font-size: 1.1rem; padding: 15px 0; border-bottom: 2px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; margin-top: 10px; }
        .titolo-secondario { font-weight: 700; font-size: 0.9rem; padding: 12px 0; border-bottom: 1px dashed var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); text-transform: uppercase; }
        .contenuto-espandibile { display: none; padding: 10px 0 15px 0; }
        .contenuto-espandibile.open { display: block; }
        
        /* Pallini Colorati Cordine */
        .color-dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; margin-right: 10px; vertical-align: middle; border: 1px solid #444; }
        
        button { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-main); font-weight: bold; cursor: pointer; }
        .btn-danger { border-color: #ff4444; color: #ff4444; }
        .btn-accent { background: var(--accent); color: var(--bg-body); border: none; }
        .box-manutenzione { border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .label-manutenzione { font-size:0.75rem; font-weight:bold; margin-bottom:8px; color:var(--text-muted); text-transform:uppercase; }
    </style>
</head>
<body>

<header>
    <h1>Conta Frutti</h1>
    <button onclick="toggleTema()" style="background:none; border:none; color:var(--text-main); font-size: 1.2rem;">☀️/🌙</button>
</header>

<!-- SELEZIONE CANTIERE -->
<div class="section">
    <select id="cantiere-select" onchange="caricaCantiere()"></select>
    <div style="display:flex; gap:10px;">
        <input type="text" id="nuovo-cantiere" placeholder="NOME NUOVO CANTIERE...">
        <button onclick="aggiungiCantiere()" class="btn-accent" style="width:50px;">+</button>
    </div>
</div>

<!-- 1. MATERIALE GENERALE -->
<div class="section">
    <div class="titolo-principale" onclick="toggle('mat-generale')">MATERIALE GENERALE <span>▼</span></div>
    <div id="mat-generale" class="contenuto-espandibile">
        <div id="render-materiali"></div>
    </div>
</div>

<!-- 2. STANZE -->
<div class="section">
    <div class="titolo-principale" onclick="toggle('stanze-generale')">STANZE <span>▼</span></div>
    <div id="stanze-generale" class="contenuto-espandibile">
        <div id="lista-stanze"></div>
        <div style="display:flex; gap:10px; margin-top:20px; border-top: 1px solid var(--border); padding-top: 15px;">
            <input type="text" id="nuova-stanza" placeholder="NOME NUOVA STANZA...">
            <button onclick="creaStanza()" class="btn-accent" style="width:50px;">+</button>
        </div>
    </div>
</div>

<!-- 3. RIEPILOGO E INVIO -->
<div class="section">
    <div class="titolo-principale" onclick="toggle('riepilogo-sez'); generaRiepilogo();">RIEPILOGO CANTIERE <span>▼</span></div>
    <div id="riepilogo-sez" class="contenuto-espandibile">
        <textarea id="testo-riepilogo" rows="10" readonly style="font-family:monospace; font-size:0.9rem; resize:none;"></textarea>
        <div style="display:flex; gap:10px; margin-top:5px;">
            <button onclick="copiaRiepilogo()" style="flex:1;">COPIA TESTO</button>
            <button onclick="inviaWhatsApp()" class="btn-accent" style="flex:1; background:#25D366; color:#fff;">INVIA WHATSAPP</button>
        </div>
    </div>
</div>

<!-- 4. MANUTENZIONE E CONFIGURAZIONE -->
<div class="section">
    <div class="titolo-principale" onclick="toggle('manutenzione')" style="font-size: 0.9rem; color: var(--text-muted); border-bottom: 1px solid var(--border);">MANUTENZIONE APPLICAZIONE <span>▼</span></div>
    <div id="manutenzione" class="contenuto-espandibile">
        
        <!-- GESTIONE DIRETTA CANTIERE SELEZIONATO -->
        <div class="box-manutenzione">
            <div class="label-manutenzione">Gestione Cantiere Corrente</div>
            <div style="display:flex; gap:5px; margin-bottom:5px;">
                <input type="text" id="rinomina-cantiere-input" placeholder="Nuovo nome cantiere..." style="margin-bottom:0;">
                <button onclick="rinominaCantiere()">RINOMINA</button>
            </div>
            <button onclick="eliminaCantiere()" class="btn-danger" style="width:100%; padding:8px; font-size:0.85rem;">ELIMINA INTERO CANTIERE</button>
        </div>

        <!-- CORREZIONE ERRORI STANZE -->
        <div class="box-manutenzione">
            <div class="label-manutenzione">Correggi Nome Stanza</div>
            <select id="select-rinomina-stanza" style="margin-bottom:5px;"></select>
            <div style="display:flex; gap:5px;">
                <input type="text" id="nuovo-nome-stanza" placeholder="Nome stanza corretto..." style="margin-bottom:0;">
                <button onclick="rinominaStanza()">SALVA</button>
            </div>
        </div>

        <!-- MODIFICA E AGGIUNTA COMPONENTI CATALOGO -->
        <div class="box-manutenzione">
            <div class="label-manutenzione">Aggiungi Voce Extra nel Catalogo</div>
            <select id="add-cat-tipo" onchange="switchAggiuntaCatalogo()" style="margin-bottom:5px;">
                <option value="mat">Materiale Generale</option>
                <option value="fru">Frutti per Stanze</option>
            </select>
            <select id="add-cat-gruppo" style="margin-bottom:5px;"></select>
            <div style="display:flex; gap:5px;">
                <input type="text" id="add-voce-nome" placeholder="Nome nuovo elemento..." style="margin-bottom:0;">
                <button onclick="aggiungiVoceCatalogo()">AGGIUNGI</button>
            </div>
        </div>

        <div class="box-manutenzione">
            <div class="label-manutenzione">Rinomina Elemento Catalogo Esistente</div>
            <select id="mod-cat-tipo" onchange="switchModificaCatalogo()" style="margin-bottom:5px;">
                <option value="mat">Materiale Generale</option>
                <option value="fru">Frutti per Stanze</option>
            </select>
            <select id="mod-cat-gruppo" onchange="popolaVociModifica()" style="margin-bottom:5px;"></select>
            <select id="mod-cat-voce" style="margin-bottom:5px;"></select>
            <div style="display:flex; gap:5px;">
                <input type="text" id="mod-voce-nuovo-nome" placeholder="Nuovo nome corretto..." style="margin-bottom:0;">
                <button onclick="rinominaVoceCatalogo()">MODIFICA</button>
            </div>
        </div>

        <!-- BACKUP GESTIONE -->
        <div class="box-manutenzione">
            <div class="label-manutenzione">Backup Dati (Importa / Esporta)</div>
            <button onclick="esportaBackup()" style="width:100%; margin-bottom:5px;">COPIA CODICE DI BACKUP</button>
            <button onclick="importaBackup()" style="width:100%;">CARICA CODICE DI BACKUP</button>
        </div>

        <button onclick="resetData()" class="btn-danger" style="width:100%;">RIPRISTINA TUTTI I DATI COMPLETAMENTE</button>
    </div>
</div>

<script>
    // --- STRUTTURA DATI DI DEFAULT ---
    const catalogoInizialeMateriali = {
        "Cordine 1.5 mm²": [
            { label: "Marrone", color: "#8B4513" },
            { label: "Grigio", color: "#808080" },
            { label: "Nero", color: "#000" },
            { label: "Blu", color: "#00f" },
            { label: "Giallo/Verde", color: "linear-gradient(135deg, #fff200 50%, #00a651 50%)" },
            { label: "Bianco", color: "#fff" },
            { label: "Rosso", color: "#ff0000" },
            { label: "Viola", color: "#800080" },
            { label: "Arancione", color: "#ffa500" }
        ],
        "Cordine 2.5 mm²": [
            { label: "Marrone", color: "#8B4513" },
            { label: "Blu", color: "#00f" },
            { label: "Giallo/Verde", color: "linear-gradient(135deg, #fff200 50%, #00a651 50%)" }
        ],
        "Cordine 4 mm²": [
            { label: "Marrone", color: "#8B4513" },
            { label: "Blu", color: "#00f" },
            { label: "Giallo/Verde", color: "linear-gradient(135deg, #fff200 50%, #00a651 50%)" }
        ],
        "Tubi e Corrugati": [
            { label: "Tubo Ø 20mm" }, { label: "Tubo Ø 25mm" }, { label: "Tubo Ø 32mm" }
        ],
        "Materiale Consumo": [
            { label: "Morsetti" }, { label: "Nastro Isolante" }, { label: "Fascette" }
        ]
    };

    const catalogoInizialeFrutti = {
        "Supporti e Scatole": ["Scatola 3M", "Scatola 4M", "Supporto 3M", "Supporto 4M"],
        "Comandi": ["Interruttore", "Deviatore", "Invertitore", "Pulsante"],
        "Prese": ["Presa 10/16A", "Presa Schuko", "Presa TV", "Presa Rj45"],
        "Centralino": ["Magnetotermico", "Differenziale", "Scatola Centralino"]
    };

    let db = JSON.parse(localStorage.getItem('contafrutti_db'));
    if(!db || !db.cantieri) {
        let nomeIniziale = prompt("Inserisci il nome del tuo primo Cantiere:", "Cantiere 1") || "Cantiere 1";
        db = {
            cantieri: {},
            catalogoMateriali: catalogoInizialeMateriali,
            catalogoFrutti: catalogoInizialeFrutti
        };
        db.cantieri[nomeIniziale] = { stanze: {}, materiali: {} };
        localStorage.setItem('contafrutti_db', JSON.stringify(db));
    }

    let cantiere = Object.keys(db.cantieri)[0] || "";

    function save() { localStorage.setItem('contafrutti_db', JSON.stringify(db)); }
    function toggleTema() { document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); }
    function toggle(id) { document.getElementById(id).classList.toggle('open'); }

    function aggiornaSelectCantieri() {
        let s = document.getElementById('cantiere-select'); s.innerHTML = "";
        Object.keys(db.cantieri).forEach(c => s.innerHTML += `<option value="${c}">${c}</option>`);
        if(cantiere) s.value = cantiere;
    }

    function aggiungiCantiere() {
        let n = document.getElementById('nuovo-cantiere').value.trim();
        if(n && !db.cantieri[n]) {
            db.cantieri[n] = { stanze: {}, materiali: {} }; cantiere = n; save();
            aggiornaSelectCantieri(); caricaCantiere();
            document.getElementById('nuovo-cantiere').value = "";
        }
    }

    function caricaCantiere() {
        if(!cantiere && Object.keys(db.cantieri).length > 0) cantiere = Object.keys(db.cantieri)[0];
        if(!cantiere) return;
        document.getElementById('rinomina-cantiere-input').value = cantiere;
        renderMateriali(); renderStanze(); popolaSelectManutenzione();
    }

    // --- LOGICA MATERIALI ---
    function modificaMateriale(label, quantita) {
        if (!db.cantieri[cantiere].materiali) db.cantieri[cantiere].materiali = {};
        if (!db.cantieri[cantiere].materiali[label]) db.cantieri[cantiere].materiali[label] = 0;
        db.cantieri[cantiere].materiali[label] += quantita;
        if (db.cantieri[cantiere].materiali[label] < 0) db.cantieri[cantiere].materiali[label] = 0;
        save();
        let safeId = label.replace(/[^a-zA-Z0-9]/g, '_');
        document.getElementById(`qta-mat-${safeId}`).innerText = db.cantieri[cantiere].materiali[label];
    }

    function renderMateriali() {
        let container = document.getElementById('render-materiali'); container.innerHTML = "";
        Object.keys(db.catalogoMateriali).forEach((categoria, index) => {
            let safeCatId = "cat-mat-" + index;
            let htmlCat = `<div class="titolo-secondario" onclick="toggle('${safeCatId}')">${categoria} <span>▼</span></div>
                           <div id="${safeCatId}" class="contenuto-espandibile">`;
            
            db.catalogoMateriali[categoria].forEach(item => {
                let qta = (db.cantieri[cantiere].materiali && db.cantieri[cantiere].materiali[item.label]) || 0;
                let colorDotSpan = item.color ? `<span class="color-dot" style="background:${item.color}"></span>` : '';
                let safeId = item.label.replace(/[^a-zA-Z0-9]/g, '_');
                htmlCat += `
                    <div class="row">
                        <span style="font-size:0.9rem;">${colorDotSpan}${item.label}</span>
                        <div class="stepper">
                            <button class="btn-step" onclick="modificaMateriale('${item.label}', -1)">-</button>
                            <span class="qta-val" id="qta-mat-${safeId}">${qta}</span>
                            <button class="btn-step" onclick="modificaMateriale('${item.label}', 1)">+</button>
                        </div>
                    </div>`;
            });
            htmlCat += `</div>`; container.innerHTML += htmlCat;
        });
    }

    // --- LOGICA STANZE ---
    function creaStanza() {
        let n = document.getElementById('nuova-stanza').value.trim();
        if(n && !db.cantieri[cantiere].stanze[n]) { 
            db.cantieri[cantiere].stanze[n] = {}; save(); renderStanze(); popolaSelectManutenzione();
            document.getElementById('nuova-stanza').value = ""; 
        }
    }

    function modificaFrutto(stanza, voce, quantita) {
        if (!db.cantieri[cantiere].stanze[stanza][voce]) db.cantieri[cantiere].stanze[stanza][voce] = 0;
        db.cantieri[cantiere].stanze[stanza][voce] += quantita;
        if (db.cantieri[cantiere].stanze[stanza][voce] < 0) db.cantieri[cantiere].stanze[stanza][voce] = 0;
        save();
        let safeStr = stanza.replace(/[^a-zA-Z0-9]/g, '_') + "_" + voce.replace(/[^a-zA-Z0-9]/g, '_');
        document.getElementById(`qta-fru-${safeStr}`).innerText = db.cantieri[cantiere].stanze[stanza][voce];
    }

    function renderStanze() {
        let l = document.getElementById('lista-stanze'); l.innerHTML = "";
        Object.keys(db.cantieri[cantiere].stanze).forEach(s => {
            let safeStanzaId = "stanza-" + s.replace(/[^a-zA-Z0-9]/g, '_');
            let htmlStanza = `<div class="titolo-secondario" onclick="toggle('${safeStanzaId}')">${s.toUpperCase()} <span>▼</span></div>
                              <div id="${safeStanzaId}" class="contenuto-espandibile">`;
            
            Object.keys(db.catalogoFrutti).forEach(categoria => {
                htmlStanza += `<div style="font-size:0.7rem; color:var(--text-muted); margin-top:10px; font-weight:bold; text-transform:uppercase;">${categoria}</div>`;
                db.catalogoFrutti[categoria].forEach(voce => {
                    let qta = db.cantieri[cantiere].stanze[s][voce] || 0;
                    let safeStr = s.replace(/[^a-zA-Z0-9]/g, '_') + "_" + voce.replace(/[^a-zA-Z0-9]/g, '_');
                    htmlStanza += `
                        <div class="row" style="border-bottom:none; padding:6px 0;">
                            <span style="font-size:0.9rem;">${voce}</span>
                            <div class="stepper">
                                <button class="btn-step" onclick="modificaFrutto('${s}', '${voce}', -1)">-</button>
                                <span class="qta-val" id="qta-fru-${safeStr}">${qta}</span>
                                <button class="btn-step" onclick="modificaFrutto('${s}', '${voce}', 1)">+</button>
                            </div>
                        </div>`;
                });
            });
            htmlStanza += `<button onclick="eliminaStanza('${s}')" class="btn-danger" style="padding:6px; font-size:0.8rem; margin-top:15px; width:100%;">ELIMINA QUESTA STANZA</button></div>`;
            l.innerHTML += htmlStanza;
        });
    }

    function eliminaStanza(s) {
        if(confirm(`Eliminare la stanza ${s}?`)) { delete db.cantieri[cantiere].stanze[s]; save(); renderStanze(); popolaSelectManutenzione(); }
    }

    // --- RIEPILOGO ---
    function generaRiepilogo() {
        let txt = `RIEPILOGO CANTIERE: ${cantiere.toUpperCase()}\n`;
        txt += `==================================\n\n`;
        txt += `--- MATERIALE GENERALE ---\n`;
        let haMateriale = false;
        if(db.cantieri[cantiere].materiali) {
            Object.keys(db.cantieri[cantiere].materiali).forEach(matKey => {
                let qta = db.cantieri[cantiere].materiali[matKey];
                if(qta > 0) { txt += `- ${matKey}: ${qta}\n`; haMateriale = true; }
            });
        }
        if(!haMateriale) txt += `Nessun materiale inserito.\n`;

        txt += `\n--- CONTEGGIO STANZE ---\n`;
        let haStanze = false;
        Object.keys(db.cantieri[cantiere].stanze).forEach(s => {
            let stanzaTxt = "";
            Object.keys(db.cantieri[cantiere].stanze[s]).forEach(fru => {
                let qta = db.cantieri[cantiere].stanze[s][fru] || 0;
                if(qta > 0) stanzaTxt += `  . ${fru}: ${qta}\n`;
            });
            if(stanzaTxt !== "") { txt += `* STANZA: ${s.toUpperCase()}\n` + stanzaTxt; haStanze = true; }
        });
        if(!haStanze) txt += `Nessun frutto contato nelle stanze.\n`;
        document.getElementById('testo-riepilogo').value = txt;
        return txt;
    }

    function copiaRiepilogo() {
        let t = document.getElementById('testo-riepilogo'); t.select(); t.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(t.value); alert("Riepilogo copiato!");
    }

    function inviaWhatsApp() {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(generaRiepilogo())}`, '_blank');
    }

    // --- MANUTENZIONE AVANZATA ---
    function rinominaCantiere() {
        let nuovo = document.getElementById('rinomina-cantiere-input').value.trim();
        if(nuovo && nuovo !== cantiere && !db.cantieri[nuovo]) {
            db.cantieri[nuovo] = db.cantieri[cantiere];
            delete db.cantieri[cantiere]; cantiere = nuovo; save();
            aggiornaSelectCantieri(); caricaCantiere(); alert("Cantiere rinominato!");
        }
    }

    function eliminaCantiere() {
        if(confirm(`Vuoi cancellare interamente il cantiere: ${cantiere}?`)) {
            delete db.cantieri[cantiere];
            let rimasti = Object.keys(db.cantieri);
            cantiere = rimasti.length > 0 ? rimasti[0] : "";
            if(!cantiere) {
                cantiere = prompt("Nessun cantiere rimasto. Inserisci un nome per il nuovo cantiere:", "Cantiere 1") || "Cantiere 1";
                db.cantieri[cantiere] = { stanze: {}, materiali: {} };
            }
            save(); aggiornaSelectCantieri(); caricaCantiere();
        }
    }

    function popolaSelectManutenzione() {
        let sel = document.getElementById('select-rinomina-stanza'); sel.innerHTML = "";
        Object.keys(db.cantieri[cantiere].stanze).forEach(s => sel.innerHTML += `<option value="${s}">${s}</option>`);
        switchAggiuntaCatalogo(); switchModificaCatalogo();
    }

    function rinominaStanza() {
        let vecchia = document.getElementById('select-rinomina-stanza').value;
        let nuova = document.getElementById('nuovo-nome-stanza').value.trim();
        if(vecchia && nuova) {
            db.cantieri[cantiere].stanze[nuova] = db.cantieri[cantiere].stanze[vecchia];
            delete db.cantieri[cantiere].stanze[vecchia]; save(); renderStanze(); popolaSelectManutenzione();
            document.getElementById('nuovo-nome-stanza').value = ""; alert("Stanza corretta!");
        }
    }

    function switchAggiuntaCatalogo() {
        let tipo = document.getElementById('add-cat-tipo').value;
        let gruppo = document.getElementById('add-cat-gruppo'); gruppo.innerHTML = "";
        let src = (tipo === 'mat') ? db.catalogoMateriali : db.catalogoFrutti;
        Object.keys(src).forEach(g => gruppo.innerHTML += `<option value="${g}">${g}</option>`);
    }

    function aggiungiVoceCatalogo() {
        let tipo = document.getElementById('add-cat-tipo').value;
        let gruppo = document.getElementById('add-cat-gruppo').value;
        let nome = document.getElementById('add-voce-nome').value.trim();
        if(!nome) return;

        if(tipo === 'mat') {
            db.catalogoMateriali[gruppo].push({ label: nome });
        } else {
            db.catalogoFrutti[gruppo].push(nome);
        }
        save(); caricaCantiere(); document.getElementById('add-voce-nome').value = ""; alert("Elemento Extra aggiunto!");
    }

    function switchModificaCatalogo() {
        let tipo = document.getElementById('mod-cat-tipo').value;
        let gruppo = document.getElementById('mod-cat-gruppo'); gruppo.innerHTML = "";
        let sorgente = (tipo === 'mat') ? db.catalogoMateriali : db.catalogoFrutti;
        Object.keys(sorgente).forEach(g => gruppo.innerHTML += `<option value="${g}">${g}</option>`);
        popolaVociModifica();
    }

    function popolaVociModifica() {
        let tipo = document.getElementById('mod-cat-tipo').value;
        let gruppo = document.getElementById('mod-cat-gruppo').value;
        let voceSelect = document.getElementById('mod-cat-voce'); voceSelect.innerHTML = "";
        if(!gruppo) return;
        
        if(tipo === 'mat') {
            db.catalogoMateriali[gruppo].forEach(item => voceSelect.innerHTML += `<option value="${item.label}">${item.label}</option>`);
        } else {
            db.catalogoFrutti[gruppo].forEach(item => voceSelect.innerHTML += `<option value="${item}">${item}</option>`);
        }
    }

    function rinominaVoceCatalogo() {
        let tipo = document.getElementById('mod-cat-tipo').value;
        let gruppo = document.getElementById('mod-cat-gruppo').value;
        let vecchio = document.getElementById('mod-cat-voce').value;
        let nuovo = document.getElementById('mod-voce-nuovo-nome').value.trim();
        if(!vecchio || !nuovo) return;

        if(tipo === 'mat') {
            let item = db.catalogoMateriali[gruppo].find(i => i.label === vecchio);
            if(item) item.label = nuovo;
            Object.keys(db.cantieri).forEach(c => {
                if(db.cantieri[c].materiali && db.cantieri[c].materiali[vecchio] !== undefined) {
                    db.cantieri[c].materiali[nuovo] = db.cantieri[c].materiali[vecchio];
                    delete db.cantieri[c].materiali[vecchio];
                }
            });
        } else {
            let idx = db.catalogoFrutti[gruppo].indexOf(vecchio);
            if(idx !== -1) db.catalogoFrutti[gruppo][idx] = nuovo;
            Object.keys(db.cantieri).forEach(c => {
                Object.keys(db.cantieri[c].stanze).forEach(s => {
                    if(db.cantieri[c].stanze[s][vecchio] !== undefined) {
                        db.cantieri[c].stanze[s][nuovo] = db.cantieri[c].stanze[s][vecchio];
                        delete db.cantieri[c].stanze[s][vecchio];
                    }
                });
            });
        }
        save(); caricaCantiere(); document.getElementById('mod-voce-nuovo-nome').value = ""; alert("Elemento Rinnominato!");
    }

    function esportaBackup() {
        navigator.clipboard.writeText(btoa(unescape(encodeURIComponent(JSON.stringify(db))))); alert("Codice Backup copiato!");
    }

    function importaBackup() {
        let codice = prompt("Incolla qui il codice:");
        if(codice) {
            try { db = JSON.parse(decodeURIComponent(escape(atob(codice)))); save(); location.reload(); } catch(e) { alert("Codice errato!"); }
        }
    }

    function resetData() {
        if(confirm("Cancellare tutto definitivamente? Se hai fatto modifiche importanti al catalogo o hai cantieri aperti, perderai tutto.")) { localStorage.removeItem('contafrutti_db'); location.reload(); }
    }

    // Inizializzazione
    aggiornaSelectCantieri();
    caricaCantiere();
</script>
</body>
</html>
